name: CI

on:
  push:
    branches: ["main", "master", "copilot/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install a CPU-only lightweight subset for CI (skip heavy ML/NLP deps)
          pip install \
            python-dotenv pydantic loguru \
            pandas numpy scipy \
            ta scikit-learn \
            pytest
          pip install -e . --no-deps

      - name: Run tests
        env:
          LOG_LEVEL: WARNING
        run: |
          pytest finai/tests/ -v --tb=short -x \
            --ignore=finai/tests/test_drift_detector.py   # uses monkeypatch for MODELS_DIR — run separately

      - name: Run drift detector tests
        env:
          LOG_LEVEL: WARNING
        run: |
          pytest finai/tests/test_drift_detector.py -v --tb=short
